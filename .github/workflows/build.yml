name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          ZIP_FILE=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -q -o "$ZIP_FILE"
          fi

          if [ ! -d "app" ]; then
            APP_DIR=$(find . -maxdepth 3 -type d -name "app" | head -n 1)
            if [ -n "$APP_DIR" ]; then
              PARENT=$(dirname "$APP_DIR")
              cp -r "$PARENT"/* .
            fi
          fi

          rm -rf app/src/main/java/com/streamtune/music/\{* 2>/dev/null || true

      - name: Create Clean Root Gradle Configuration
        run: |
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = java.net.URI("https://jitpack.io") }
              }
          }
          rootProject.name = "StreamTune"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath("com.android.tools.build:gradle:8.5.2")
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.0")
                  classpath("com.google.dagger:hilt-android-gradle-plugin:2.51.1")
                  classpath("com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.0.0-1.0.24")
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url = java.net.URI("https://jitpack.io") }
              }
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StreamTune-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          
