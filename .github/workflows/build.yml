name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          ZIP_FILE=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -q -o "$ZIP_FILE"
          fi

          # अगर ज़िप किसी सब-फ़ोल्डर में अनपैक हुआ हो तो फ़ाइलें बाहर लाएँ
          if [ ! -d "app" ]; then
            APP_DIR=$(find . -maxdepth 3 -type d -name "app" | head -n 1)
            if [ -n "$APP_DIR" ]; then
              PARENT=$(dirname "$APP_DIR")
              cp -r "$PARENT"/* .
            fi
          fi

          # गलत नाम वाले फ़ोल्डर की सफ़ाई
          rm -rf app/src/main/java/com/streamtune/music/\{* 2>/dev/null || true

      - name: Create Missing Root Gradle Configs
        run: |
          # 1. Create settings.gradle.kts if missing
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = java.net.URI("https://jitpack.io") }
              }
          }
          rootProject.name = "StreamTune"
          include(":app")
          EOF
          fi

          # 2. Create root build.gradle.kts if missing
          if [ ! -f build.gradle.kts ] && [ ! -f build.gradle ]; then
            cat << 'EOF' > build.gradle.kts
          plugins {
              alias(libs.plugins.android.application) apply false
              alias(libs.plugins.kotlin.android) apply false
              alias(libs.plugins.kotlin.compose) apply false
              alias(libs.plugins.hilt.android) apply false
              alias(libs.plugins.ksp) apply false
          }
          EOF
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StreamTune-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          
    
          
